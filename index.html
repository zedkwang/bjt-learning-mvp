<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="한자에서 일본어 발음으로 바로 연결하는 BJT 대비 학습 MVP"
    />
    <title>BJT ARC — 비즈니스 일본어 리딩 드릴</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="주요 메뉴">
        <a class="brand" href="#dashboard" data-view-link="dashboard" aria-label="BJT ARC 홈">
          <span class="brand-mark" aria-hidden="true">読</span>
          <span>
            <strong>BJT ARC</strong>
            <small>READING CONTROL</small>
          </span>
        </a>

        <nav class="nav-list">
          <button class="nav-item" type="button" data-view="words">
            <span aria-hidden="true">字</span>
            <span>단어 학습</span>
          </button>
          <button class="nav-item" type="button" data-view="n1">
            <span aria-hidden="true">一</span>
            <span>일반 N1</span>
          </button>
          <button class="nav-item" type="button" data-view="sentences">
            <span aria-hidden="true">文</span>
            <span>문장 학습</span>
          </button>
          <button class="nav-item" type="button" data-view="wordbook">
            <span aria-hidden="true">冊</span>
            <span>단어장</span>
          </button>
          <button class="nav-item" type="button" data-view="review">
            <span aria-hidden="true">↻</span>
            <span>복습 보관함</span>
          </button>
          <button class="nav-item" type="button" data-view="boss">
            <span aria-hidden="true">✦</span>
            <span>주간 라운드</span>
          </button>
        </nav>

        <section class="side-card" aria-labelledby="side-rank-title">
          <p class="eyebrow">READING RANK</p>
          <h2 id="side-rank-title" data-rank-name>읽기 집중자</h2>
          <div class="rank-progress" aria-hidden="true">
            <span data-rank-progress></span>
          </div>
          <p><strong data-xp-total>0</strong> XP · 다음 등급까지 <span data-xp-next>120</span></p>
        </section>

        <button class="reset-button" type="button" id="reset-data">
          학습 기록 초기화
        </button>
      </aside>

      <main id="app-main" tabindex="-1">
        <header class="mobile-header">
          <a class="brand" href="#dashboard" data-view-link="dashboard" aria-label="BJT ARC 홈">
            <span class="brand-mark" aria-hidden="true">読</span>
            <strong>BJT ARC</strong>
          </a>
          <span class="mobile-xp"><b data-xp-total>0</b> XP</span>
        </header>

        <div id="view-root"></div>
      </main>

      <nav class="mobile-nav" aria-label="모바일 주요 메뉴">
        <button class="nav-item" type="button" data-view="words">
          <span aria-hidden="true">字</span><span>단어</span>
        </button>
        <button class="nav-item" type="button" data-view="n1">
          <span aria-hidden="true">一</span><span>N1</span>
        </button>
        <button class="nav-item" type="button" data-view="sentences">
          <span aria-hidden="true">文</span><span>문장</span>
        </button>
        <button class="nav-item" type="button" data-view="wordbook">
          <span aria-hidden="true">冊</span><span>단어장</span>
        </button>
        <button class="nav-item" type="button" data-view="review">
          <span aria-hidden="true">↻</span><span>복습</span>
        </button>
        <button class="nav-item" type="button" data-view="boss">
          <span aria-hidden="true">✦</span><span>라운드</span>
        </button>
      </nav>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="./data/processed/catalog.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
